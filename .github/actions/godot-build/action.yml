name: Build Godot
description: Build Godot with the provided options.

inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: editor
    type: choice
    options: [editor, template_debug, template_release]
  platform:
    description: Target platform.
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string

runs:
  using: composite
  steps:
    - name: SCons Build
      shell: sh
      run: |
        echo "Building with flags:" platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} "cache_path=${{ inputs.scons-cache }}" redirect_build_objects=no

        if [ "${{ inputs.target }}" != "editor" ]; then
          # Ensure we don't include editor code in export template builds.
          #
          # Fork-local: upstream deletes the whole `editor` tree here. We delete only the
          # translation units and keep the headers, because modules/limboai's compat layer
          # includes `editor/gui/window_wrapper.h` from compat_window_wrapper.cpp without a
          # TOOLS_ENABLED guard. That file is empty in a module template build - its body is
          # all `#ifdef LIMBOAI_GDEXTENSION` - so the include costs nothing, but it does have
          # to resolve. Removing the sources still enforces what this step is for: with no
          # editor object files, any template build that genuinely uses editor code fails to
          # link. Drop this back to `rm -rf editor` once limboai guards that include.
          find editor -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.mm' -o -name '*.m' \) -delete
        fi

        if [ "${{ github.event.number }}" != "" ]; then
          # Set build identifier with pull request number if available. This is displayed throughout the editor.
          export BUILD_NAME="gh-${{ github.event.number }}"
        else
          export BUILD_NAME="gh"
        fi

        scons platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} "cache_path=${{ inputs.scons-cache }}" redirect_build_objects=no
        ls -l bin/
