name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    # Cloned outside the workspace, and to a deliberately short path: SCons hands the
    # full `ar` command line to `sh -c` as a single argument, which the kernel caps at
    # 128 KiB (MAX_ARG_STRLEN). godot-cpp archives ~1100 objects referenced by absolute
    # path, so the workspace path length alone decides whether the archive step fits.
    - name: Checkout
      shell: sh
      run: |
        rm -rf "$HOME/gdcpp"
        git clone --depth 1 --recurse-submodules --shallow-submodules \
          --branch "${{ inputs.godot-cpp-branch }}" \
          https://github.com/godotengine/godot-cpp.git "$HOME/gdcpp"

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory="$HOME/gdcpp/test" "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
